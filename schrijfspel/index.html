<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff7e6">
<title>Schrijfspel: letters schrijven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Schrijfspel voor 5-jarigen: letters, hoofdletters en cijfers overtrekken met je vinger op de iPad.
   Een stem leest alles voor, je verdient sterren, stickers en nieuwe pennen, en aan het einde een diploma. */
:root{
  --bg:#fff7e6; --panel:#ffffff; --fg:#2b2340; --muted:#6b6380; --line:#eadcc8;
  --accent:#ff7a1a; --accent-fg:#ffffff; --accent2:#4f7cff;
  --good:#1f9d55; --good-bg:#e4f6ea; --bad:#d64545; --bad-bg:#fcebea;
  --hl:#ffd400; --card:#fff3cf; --paper:#fffdf7; --paperline:#bcd4ea;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1c1830; --panel:#2a2444; --fg:#f4f0ff; --muted:#b8b0d0; --line:#4a4270;
  --accent:#ff9448; --accent-fg:#201200; --accent2:#7c9cff; --card:#3a3260; --paper:#fffdf7; --paperline:#bcd4ea;
  --good:#4fcf84; --good-bg:#1a3a2a; --bad:#ff7b7b; --bad-bg:#432326; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1c1830; --panel:#2a2444; --fg:#f4f0ff; --muted:#b8b0d0; --line:#4a4270;
  --accent:#ff9448; --accent-fg:#201200; --accent2:#7c9cff; --card:#3a3260; --paper:#fffdf7; --paperline:#bcd4ea;
  --good:#4fcf84; --good-bg:#1a3a2a; --bad:#ff7b7b; --bad-bg:#432326; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  background-image:radial-gradient(circle at 10% 10%,rgba(255,122,26,.10),transparent 40%),radial-gradient(circle at 90% 90%,rgba(79,124,255,.12),transparent 40%)}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:56px;padding:.6rem 1.5rem;border-radius:999px;border:0;
  background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-size:1.3rem;font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.secondary{background:var(--panel);color:var(--fg);border:2px solid var(--line)}
.btn:focus-visible,input:focus-visible,.settile:focus-visible,.avatar:focus-visible,.pen:focus-visible,.cell:focus-visible{outline:4px solid var(--accent2);outline-offset:3px}
.screen{height:100%;display:flex;flex-direction:column}

/* Startscherm */
#start{align-items:center;justify-content:flex-start;text-align:center;gap:.9rem;overflow:auto;padding-bottom:1rem}
#start h1{font-size:clamp(1.9rem,6vw,3.2rem);color:var(--accent);margin-top:.4rem}
#start p{max-width:36ch;margin:0;color:var(--muted);font-size:1.05rem}
.hero{font-family:var(--display);font-weight:700;font-size:clamp(2.4rem,9vw,4.2rem);line-height:1.1;letter-spacing:.06em;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15));animation:float 3s ease-in-out infinite}
.hero span:nth-child(1){color:#ff7a1a}.hero span:nth-child(2){color:#4f7cff}.hero span:nth-child(3){color:#1f9d55}.hero span:nth-child(4){color:#ff4fa3}.hero span:nth-child(5){color:#8a4fff}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.namebox{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;align-items:center}
input[type=text]{font:inherit;font-size:1.4rem;padding:.6rem 1rem;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--fg);min-width:min(16rem,80vw);-webkit-user-select:text;user-select:text}
.avatars{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.avatar{font-size:2.2rem;width:66px;height:66px;border-radius:50%;border:3px solid var(--line);background:var(--panel);transition:transform .1s}
.avatar.sel{border-color:var(--accent);background:var(--card);transform:scale(1.12);box-shadow:0 0 0 4px rgba(255,122,26,.25)}
.label{font-family:var(--display);font-size:1.1rem;color:var(--muted)}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:.8rem;width:min(100%,720px)}
.settile{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.9rem .6rem;border-radius:22px;background:var(--panel);border:3px solid var(--line);box-shadow:0 6px 0 var(--line);transition:transform .1s;--c:var(--accent)}
.settile:active{transform:translateY(4px);box-shadow:none}
.settile .ico{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1;color:var(--c)}
.settile b{font-family:var(--display);font-size:1.15rem;font-weight:600}
.settile small{color:var(--muted);font-size:.85rem}
.settile.naam{--c:#ff4fa3}.settile.klein{--c:#4f7cff}.settile.groot{--c:#1f9d55}.settile.cijfer{--c:#8a4fff}.settile.kaart{--c:#ff7a1a}
.progressline{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;font-family:var(--display);font-size:1.05rem;color:var(--muted)}
.progressline b{color:var(--fg)}
#settings{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1rem;display:flex;flex-direction:column;gap:.8rem;max-width:34rem;text-align:left}
#settings label{display:flex;gap:.6rem;align-items:center;font-size:1rem}
.gear{background:none;border:0;font-size:1.6rem;position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:12px;opacity:.6;z-index:5}
.stickerbook{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;font-size:2rem;background:var(--card);border-radius:16px;padding:.5rem .8rem;max-width:min(100%,560px)}
.stickerbook span{animation:pop .6s both}
.stickerbook .empty{font-size:1rem;color:var(--muted);font-family:var(--display)}

/* Letterkaart */
#letters{gap:.6rem;overflow:auto}
#letters .topbar h2{font-size:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:.5rem}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-height:74px;border-radius:16px;border:3px solid var(--line);background:var(--panel);font-family:var(--display);font-size:2rem;font-weight:600;line-height:1;box-shadow:0 3px 0 var(--line)}
.cell small{font-size:.7rem;letter-spacing:-.05em;color:#d4a017;min-height:.9em}
.cell.done{border-color:#d4a017;background:var(--card)}
.grid h3{grid-column:1/-1;font-size:1.1rem;color:var(--muted);margin-top:.4rem}

/* Spelscherm */
#game{gap:6px}
.topbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.topbar .who{font-family:var(--display);font-size:1.25rem;display:flex;align-items:center;gap:.4rem}
.counter{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;margin-left:auto}
.sound,.home{background:none;border:0;font-size:1.5rem;line-height:1}
.pens{display:flex;gap:.3rem;flex-wrap:wrap}
.pen{width:38px;height:38px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);background:var(--pc);font-size:1rem;display:grid;place-items:center;position:relative;transition:transform .1s}
.pen.sel{transform:scale(1.2);box-shadow:0 0 0 3px var(--fg)}
.pen.lock{opacity:.45;filter:grayscale(.6)}
.pen.lock::after{content:"🔒";font-size:.9rem}
.pen.rainbow{background:conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red)}
.pen.goud{background:linear-gradient(135deg,#ffe36b,#d4a017)}
.pen.new{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}

/* Reis met stickers */
.journey{position:relative;padding:34px 10px 4px}
.track{display:flex;justify-content:space-between;align-items:center;position:relative}
.track::before{content:"";position:absolute;left:4%;right:4%;top:50%;height:8px;border-radius:4px;background:var(--line);transform:translateY(-50%)}
.track .fill{position:absolute;left:4%;top:50%;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform:translateY(-50%);transition:width .6s cubic-bezier(.2,1,.3,1);width:0}
.station{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;background:var(--panel);border:3px solid var(--line);display:grid;place-items:center;font-size:1rem;transition:transform .3s}
.station.done{border-color:var(--accent);background:var(--card);font-size:1.3rem;width:38px;height:38px}
.station.done.new{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.walker{position:absolute;top:-12px;left:4%;font-size:1.9rem;transform:translateX(-50%);transition:left .7s cubic-bezier(.3,1.3,.5,1);filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));z-index:2}
.walker.hop{animation:hop .7s ease-in-out}
@keyframes hop{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-18px) rotate(-10deg)}}

/* Schrijfpodium */
.stage{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:.5rem .8rem .6rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;position:relative;overflow:hidden}
.prompt{display:flex;align-items:center;gap:.6rem;font-family:var(--display);font-size:clamp(1.15rem,3.4vw,1.6rem);text-align:center;color:var(--muted);flex-wrap:wrap;justify-content:center}
.prompt .big{font-size:1.6em;color:var(--accent);font-weight:700;line-height:1}
.prompt button{background:var(--card);border:2px solid var(--line);border-radius:999px;font-size:1.3rem;width:48px;height:48px;flex:none}
.prompt .woord{display:inline-flex;align-items:center;gap:.3rem;background:var(--card);border-radius:999px;padding:.1rem .8rem;font-size:.9em}
.canvaswrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas.paper{touch-action:none;border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.12);background:var(--paper);cursor:crosshair}
.tools{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;justify-content:center}
.tools .btn{min-height:46px;font-size:1.05rem;padding:.4rem 1.1rem}
.feedback{position:absolute;left:0;right:0;bottom:16%;margin:auto;width:fit-content;max-width:92%;border-radius:999px;padding:.6rem 1.4rem;font-family:var(--display);font-size:1.5rem;font-weight:600;animation:pop .4s both;z-index:3;display:flex;align-items:center;gap:.6rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.feedback.good{background:var(--good);color:#fff} .feedback.bad{background:var(--bad);color:#fff}
.feedback .emo{font-size:2.2rem;animation:float 1.2s ease-in-out infinite}
.verder{position:absolute;right:12px;bottom:12px;z-index:3}
.sticker-toast{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50}
.sticker-toast div{font-size:clamp(5rem,30vw,10rem);animation:stick 1.6s cubic-bezier(.2,1.2,.4,1) both;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))}
@keyframes stick{0%{transform:scale(0) rotate(-30deg);opacity:0}40%{transform:scale(1.2) rotate(8deg);opacity:1}75%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(.6) translateY(-40vh);opacity:0}}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:999px;padding:.6rem 1.3rem;font-family:var(--display);font-size:1.2rem;z-index:60;animation:pop .4s both;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .4s}

/* Eindscherm */
#end{align-items:center;justify-content:flex-end;text-align:center;gap:1rem;position:relative;padding-bottom:4vh}
#fw{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:#070b1a}
#end .endcard{position:relative;z-index:1;max-height:62vh;overflow:auto;background:color-mix(in srgb,var(--panel) 92%,transparent);border-radius:22px;padding:1.2rem 1.4rem;max-width:36rem;display:flex;flex-direction:column;gap:.7rem;align-items:center}
#end h1{font-size:clamp(1.7rem,6vw,2.8rem)}
#end .big{font-family:var(--display);font-size:1.3rem;margin:0}
.stars{font-size:2rem;letter-spacing:.1em}
.diploma{border:4px double #c9a227;border-radius:14px;padding:.9rem 1.2rem;background:linear-gradient(135deg,#fff8dc,#ffe9a3);color:#3a2600;display:flex;flex-direction:column;gap:.15rem;align-items:center;max-width:100%;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
.diploma .medal{font-size:3rem;line-height:1;animation:spin 2.4s ease-in-out infinite}
.diploma .kop{font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8a6a0a}
.diploma .naam{font-family:var(--display);font-size:2rem;font-weight:700;color:#b5471b}
.diploma .sub{font-size:.95rem;color:#5a4a1a}
.diploma .geschreven{font-family:var(--display);font-size:1.6rem;letter-spacing:.15em;color:#2b4fb5}
@keyframes spin{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.endbtns{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
</style>
</head>
<body>

<!-- ===================== STARTSCHERM ===================== -->
<section id="start" class="screen">
  <button class="gear" id="gearbtn" type="button" aria-label="Instellingen">⚙️</button>
  <div class="hero" aria-hidden="true"><span>a</span><span>b</span><span>c</span><span>✏️</span><span>1</span></div>
  <h1>Schrijfspel</h1>
  <p>Volg de letter met je vinger. Begin bij de groene stip en volg de pijl. Je wint sterren, stickers en nieuwe pennen!</p>

  <div class="namebox">
    <span class="label">Hoe heet je?</span>
    <input type="text" id="naam" placeholder="Jouw naam" autocomplete="off" maxlength="20" enterkeyhint="done">
  </div>
  <span class="label">Kies je figuurtje</span>
  <div class="avatars" id="avatars"></div>

  <span class="label">Wat ga je schrijven?</span>
  <div class="sets">
    <button class="settile naam" type="button" data-set="naam"><span class="ico">✍️</span><b>Mijn naam</b><small>de letters van je naam</small></button>
    <button class="settile klein" type="button" data-set="klein"><span class="ico">a b c</span><b>Kleine letters</b><small>a tot en met z</small></button>
    <button class="settile groot" type="button" data-set="groot"><span class="ico">A B C</span><b>Hoofdletters</b><small>A tot en met Z</small></button>
    <button class="settile cijfer" type="button" data-set="cijfer"><span class="ico">1 2 3</span><b>Cijfers</b><small>0 tot en met 9</small></button>
    <button class="settile kaart" type="button" data-set="kaart"><span class="ico">🗂️</span><b>Kies zelf</b><small>de letterkaart met sterren</small></button>
  </div>

  <div class="progressline" id="progressline"></div>
  <div class="stickerbook" id="book0"></div>

  <div id="settings" hidden>
    <label><input type="checkbox" id="soundopt" checked> Stem en geluid aan</label>
    <label><input type="checkbox" id="hulpopt" checked> Met hulp (voorbeeld-streepje en dikke letter)</label>
    <label><input type="checkbox" id="autoopt" checked> Vanzelf verder na een letter</label>
    <button class="btn secondary" type="button" id="resetbtn">Alle sterren en stickers wissen</button>
  </div>
</section>

<!-- ===================== LETTERKAART ===================== -->
<section id="letters" class="screen" hidden>
  <div class="topbar">
    <button class="home" id="kaartterug" type="button" aria-label="Terug">🏠</button>
    <h2>Tik op een letter om te oefenen</h2>
  </div>
  <div class="grid" id="lettergrid"></div>
</section>

<!-- ===================== SPELSCHERM ===================== -->
<section id="game" class="screen" hidden>
  <div class="topbar">
    <button class="home" id="homebtn" type="button" aria-label="Terug naar start">🏠</button>
    <div class="who" id="who"></div>
    <div class="pens" id="pens" aria-label="Kies een pen"></div>
    <div class="counter" id="counter"></div>
    <button class="sound" id="soundbtn" type="button" aria-label="Geluid aan of uit">🔊</button>
  </div>
  <div class="journey">
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <div class="walker" id="walker">🐸</div>
  </div>
  <div class="stage" id="stage">
    <div class="prompt" id="prompt">
      <button type="button" id="replay" aria-label="Nog eens voorlezen">🔊</button>
      <span>Schrijf de</span> <span class="big" id="bigletter">a</span>
      <span class="woord" id="woord"></span>
    </div>
    <div class="canvaswrap" id="canvaswrap"><canvas class="paper" id="paper"></canvas></div>
    <div class="tools">
      <button class="btn secondary" type="button" id="voordoen">👀 Doe voor</button>
      <button class="btn secondary" type="button" id="opnieuw">🧽 Opnieuw</button>
    </div>
  </div>
</section>

<!-- ===================== EINDSCHERM ===================== -->
<section id="end" class="screen" hidden>
  <canvas id="fw"></canvas>
  <div class="endcard">
    <h1 id="endtitle">Hoera!</h1>
    <div class="stars" id="endstars"></div>
    <div class="diploma" id="diploma">
      <div class="medal">🏅</div>
      <div class="kop">Schrijfdiploma</div>
      <div class="naam" id="dipnaam"></div>
      <div class="geschreven" id="dipletters"></div>
      <div class="sub" id="dipsub"></div>
    </div>
    <p class="big">Jouw stickers:</p>
    <div class="stickerbook" id="book"></div>
  </div>
  <div class="endbtns">
    <button class="btn" type="button" id="again">Nog een keer ✍️</button>
    <button class="btn secondary" type="button" id="tostart">Iets anders 🏠</button>
  </div>
</section>

<canvas id="confetti"></canvas>

<script>
'use strict';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('schrijfspel.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('schrijfspel.'+k,JSON.stringify(v));}catch(e){}}};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

/* ===================== LETTERVORMEN =====================
   Eenheden: 100 breed, 150 hoog. Schrijflijnen: kop 20, romp 60, grondlijn 100, staart 130.
   Hoeken in graden zoals op het scherm: 0 = rechts, 90 = onder, -90 = boven. Oplopend = met de klok mee. */
const TOP=20, MID=60, BASE=100, BOT=130, STEP=1.5;
const rad=d=>d*Math.PI/180;
function A(...a){ let [cx,cy,rx,ry,a0,a1]=a; if(a.length===5){ a1=a0; a0=ry; ry=rx; } const span=a1-a0; const n=Math.max(8,Math.round(Math.abs(span)/360*2*Math.PI*Math.max(rx,ry)/STEP)); const p=[]; for(let i=0;i<=n;i++){ const t=rad(a0+span*i/n); p.push([cx+rx*Math.cos(t),cy+ry*Math.sin(t)]); } return p; }
function L(x0,y0,x1,y1){ const n=Math.max(2,Math.round(Math.hypot(x1-x0,y1-y0)/STEP)); const p=[]; for(let i=0;i<=n;i++) p.push([x0+(x1-x0)*i/n,y0+(y1-y0)*i/n]); return p; }
function B(x0,y0,x1,y1,x2,y2,x3,y3){ const p=[]; for(let i=0;i<=40;i++){ const t=i/40,u=1-t; p.push([u*u*u*x0+3*u*u*t*x1+3*u*t*t*x2+t*t*t*x3, u*u*u*y0+3*u*u*t*y1+3*u*t*t*y2+t*t*t*y3]); } return p; }

  $('#counter').textContent=`${state.idx+1} / ${state.list.length}`;
  $('#stage').querySelectorAll('.feedback,.verder').forEach(x=>x.remove());
  speakLetter(); state.demo=state.hulp?performance.now()+900:null;
}
function speakLetter(){ const ch=state.letter, w=wordFor(ch); say(isDigit(ch)?`Schrijf de ${w[0]}. Begin bij de groene stip.`:`Schrijf de ${spoken(ch)}. ${spoken(ch)} van ${w[0]}. Begin bij de groene stip.`); }
function letterDone(){
  state.busy=true; fanfare(); const r=cv.getBoundingClientRect(); confetti(r.left+r.width/2,r.top+r.height/2,90);
  const ch=state.letter, w=wordFor(ch); const key=ch; state.stars[key]=Math.min(3,(state.stars[key]||0)+1); state.total++; state.sessionStars++; save();
  const fb=document.createElement('div'); fb.className='feedback good'; fb.innerHTML=`<span class="emo">${w[1].slice(0,2)}</span> ${rnd(PRAISE)} ${isDigit(ch)?w[0]:ch+' van '+w[0]}`; $('#stage').appendChild(fb);
  say(`${rnd(PRAISE)} ${isDigit(ch)?'De '+w[0]+'!':spoken(ch)+' van '+w[0]+'!'}`);
  const newPen=PENS.find(p=>p.need===state.total); const done=updateJourney();
  let delay=2400;
  if(done>state.earned.length){ const sticker=rnd(STICKERS.filter(s=>!state.stickers.includes(s)))||rnd(STICKERS); state.earned.push(sticker); if(!state.stickers.includes(sticker)) state.stickers.push(sticker); save(); setTimeout(()=>{ stickerToast(sticker); say('Je hebt een sticker verdiend!',{keep:true}); },900); delay+=1200; }
  if(newPen){ setTimeout(()=>{ buildPens(); state.pen=newPen.id; save(); buildPens(); toast(`🎉 Nieuwe pen gewonnen: de ${newPen.naam}!`); say(`Je hebt een nieuwe pen gewonnen: de ${newPen.naam}!`,{keep:true}); fanfare(); },delay-800); delay+=2200; }
  const b=document.createElement('button'); b.className='btn verder'; b.type='button'; b.textContent='Verder ➡️'; b.addEventListener('click',()=>{ if(canSpeak()) speechSynthesis.cancel(); next(); }); $('#stage').appendChild(b);
  if(state.auto) state.autoT=setTimeout(next,delay);
}
function next(){ clearTimeout(state.autoT); if(!state.busy) return; state.idx++; if(state.idx>=state.list.length) endGame(); else loadLetter(state.list[state.idx]); }
function startSession(set,list){
  state.set=set; state.list=list; state.idx=0; state.earned=[]; state.sessionStars=0; state.busy=false;
  $('#who').innerHTML=`<span>${state.avatar}</span> ${state.naam||''}`; $('#walker').textContent=state.avatar; $('#soundbtn').textContent=state.sound?'🔊':'🔇';
  buildTrack(); buildPens(); show('game'); sizeCanvas(); if(!raf) raf=requestAnimationFrame(loop);
  setTimeout(()=>{ sizeCanvas(); updateJourney(); loadLetter(list[0]); },250);
}
function pickList(chars,n){ const pool=chars.slice().sort((a,b)=>(state.stars[a]||0)-(state.stars[b]||0)||Math.random()-0.5); const take=pool.slice(0,Math.min(n,pool.length)); return chars.filter(c=>take.includes(c)); }
function nameLetters(n){ const clean=n.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9 \-]/g,''); const parts=clean.split(/[\s\-]+/).filter(Boolean).map(p=>p[0].toUpperCase()+p.slice(1).toLowerCase()); return parts.join('').split('').filter(c=>SHAPES[c]); }
function startSet(set){
  unlockAudio(); const n=$('#naam').value.trim(); state.naam=n; save();
  if(set==='kaart'){ buildGrid(); show('letters'); return; }
  let list;
  if(set==='naam'){ list=nameLetters(n); if(!list.length){ say('Typ eerst je naam.'); $('#naam').focus(); $('#naam').classList.add('shake'); setTimeout(()=>$('#naam').classList.remove('shake'),500); return; } }
  else list=pickList(SETS[set],8);
  startSession(set,list); say(`Hoi ${n||''}! Daar gaan we.`);
}

/* Reis met stickers */
const stationsFor=()=>Math.max(1,Math.ceil(state.list.length/2));
function buildTrack(){ const t=$('#track'); t.querySelectorAll('.station').forEach(s=>s.remove()); for(let i=0;i<stationsFor();i++){ const s=document.createElement('div'); s.className='station'; s.textContent='•'; t.appendChild(s);} $('#walker').style.left='4%'; $('#fill').style.width='0'; }
function updateJourney(){ const N=stationsFor(); const done=Math.min(N,Math.floor((state.idx+(state.busy?1:0))/2)); $('#track').querySelectorAll('.station').forEach((s,i)=>{ if(i<done&&!s.classList.contains('done')){ s.classList.add('done','new'); s.textContent=state.earned[i]||'⭐'; } });
  const pct=4+92*((state.idx+(state.busy?1:0))/state.list.length); $('#walker').style.left=Math.min(96,pct)+'%'; $('#fill').style.width=Math.min(92,pct-4)+'%'; $('#walker').classList.remove('hop'); void $('#walker').offsetWidth; $('#walker').classList.add('hop'); return done; }
function stickerToast(s){ const t=document.createElement('div'); t.className='sticker-toast'; t.innerHTML=`<div>${s}</div>`; document.body.appendChild(t); confetti(innerWidth/2,innerHeight/2,120); setTimeout(()=>t.remove(),1700); }
function toast(txt){ const t=document.createElement('div'); t.className='toast'; t.textContent=txt; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }

/* Pennen */
function buildPens(){ const box=$('#pens'); const had=new Set([...box.querySelectorAll('.pen')].filter(b=>!b.classList.contains('lock')).map(b=>b.dataset.id)); box.innerHTML=''; for(const p of PENS){ const b=document.createElement('button'); b.type='button'; b.dataset.id=p.id; const un=penUnlocked(p); b.className='pen'+(p.id==='rainbow'?' rainbow':'')+(p.id==='goud'?' goud':'')+(un?'':' lock')+(p.id===curPen().id?' sel':'')+(un&&had.size&&!had.has(p.id)?' new':''); if(p.color!=='rainbow'&&p.id!=='goud') b.style.setProperty('--pc',p.color); b.title=un?p.naam:`Nog ${p.need-state.total} letters`; b.setAttribute('aria-label',b.title);
  b.addEventListener('click',()=>{ if(!un){ say(`Nog ${p.need-state.total} letters, dan krijg je de ${p.naam}.`); toast(`🔒 Nog ${p.need-state.total} letters voor de ${p.naam}`); return; } state.pen=p.id; save(); buildPens(); say(`De ${p.naam}!`); }); box.appendChild(b); } }

/* Letterkaart */
function buildGrid(){ const g=$('#lettergrid'); g.innerHTML=''; const groups=[['Kleine letters','abcdefghijklmnopqrstuvwxyz'],['Hoofdletters','ABCDEFGHIJKLMNOPQRSTUVWXYZ'],['Cijfers','0123456789']]; for(const [t,chars] of groups){ const h=document.createElement('h3'); h.textContent=t; g.appendChild(h); for(const ch of chars){ const b=document.createElement('button'); b.type='button'; const st=state.stars[ch]||0; b.className='cell'+(st?' done':''); b.innerHTML=`${ch}<small>${'★'.repeat(st)}</small>`; b.addEventListener('click',()=>{ unlockAudio(); startSession('kaart',[ch,ch,ch]); say(`De ${spoken(ch)}. Drie keer schrijven!`); }); g.appendChild(b); } } }

/* Startscherm */
function updateStart(){ const stars=Object.values(state.stars).reduce((a,b)=>a+b,0); const pens=PENS.filter(penUnlocked).length; $('#progressline').innerHTML=`<span>⭐ <b>${stars}</b> sterren</span><span>✍️ <b>${state.total}</b> letters</span><span>🖍️ <b>${pens}</b> van ${PENS.length} pennen</span>`; const bk=$('#book0'); bk.innerHTML=state.stickers.length?state.stickers.map(s=>`<span>${s}</span>`).join(''):'<span class="empty">Nog geen stickers. Schrijf letters en win ze!</span>'; }
function show(id){ for(const s of ['start','letters','game','end']) $('#'+s).hidden=(s!==id); if(id==='start') updateStart(); }

/* ===================== EINDE EN VUURWERK ===================== */
let fw=null;
function endGame(){
  if(canSpeak()) speechSynthesis.cancel(); state.busy=false;
  const n=state.list.length; $('#endtitle').textContent=`Hoera ${state.naam||''}!`; $('#endstars').textContent='⭐'.repeat(Math.min(10,n));
  $('#dipnaam').textContent=state.naam||'Kanjer'; $('#dipletters').textContent=state.list.join(' '); $('#dipsub').textContent=`heeft ${n} ${n===1?'letter':'letters'} geschreven op ${new Date().toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'})}`;
  $('#book').innerHTML=state.stickers.map((s,i)=>`<span style="animation-delay:${i*0.08}s">${s}</span>`).join('');
  show('end'); say(`Hoera ${state.naam||''}! Je hebt alle letters geschreven. Hier is je diploma!`);
  fw=new Fireworks($('#fw')); fw.start();
}
class Fireworks{ constructor(c){ this.c=c; this.x=c.getContext('2d'); this.p=[]; this.on=false; }
  start(){ this.on=true; this.c.width=innerWidth; this.c.height=innerHeight; this.t0=performance.now(); this.next=0; requestAnimationFrame(t=>this.frame(t)); }
  stop(){ this.on=false; }
  burst(){ const x=Math.random()*this.c.width, y=Math.random()*this.c.height*0.6+40, hue=Math.random()*360; for(let i=0;i<90;i++){ const a=Math.random()*Math.PI*2, s=Math.random()*5+1; this.p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,hue:hue+Math.random()*40}); } }
  frame(t){ if(!this.on) return; const x=this.x; x.fillStyle='rgba(7,11,26,.22)'; x.fillRect(0,0,this.c.width,this.c.height); if(t>this.next&&t-this.t0<20000){ this.burst(); if(Math.random()<0.4) this.burst(); this.next=t+500+Math.random()*700; }
    for(const q of this.p){ q.x+=q.vx; q.y+=q.vy; q.vy+=0.04; q.vx*=0.985; q.vy*=0.985; q.life-=0.012; x.fillStyle=`hsla(${q.hue} 100% 65% / ${Math.max(0,q.life)})`; x.beginPath(); x.arc(q.x,q.y,2.2,0,Math.PI*2); x.fill(); } this.p=this.p.filter(q=>q.life>0); requestAnimationFrame(t=>this.frame(t)); } }

/* Confetti */
const cc=$('#confetti'), cx=cc.getContext('2d'); let confs=[]; let confRunning=false;
function confetti(x,y,n=60){ cc.width=innerWidth; cc.height=innerHeight; for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=Math.random()*7+3; confs.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,life:1,hue:Math.random()*360,r:Math.random()*5+3,rot:Math.random()*6}); } if(!confRunning){ confRunning=true; requestAnimationFrame(confLoop); } }
function confLoop(){ cx.clearRect(0,0,cc.width,cc.height); for(const p of confs){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.vx*=0.98; p.life-=0.016; p.rot+=0.1; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=`hsla(${p.hue} 90% 60% / ${Math.max(0,p.life)})`; cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); cx.restore(); } confs=confs.filter(p=>p.life>0); if(confs.length) requestAnimationFrame(confLoop); else { confRunning=false; cx.clearRect(0,0,cc.width,cc.height);} }

/* ===================== KNOPPEN ===================== */
document.querySelectorAll('.settile').forEach(b=>b.addEventListener('click',()=>startSet(b.dataset.set)));
$('#naam').value=state.naam; $('#naam').addEventListener('change',()=>{ state.naam=$('#naam').value.trim(); save(); });
const av=$('#avatars'); AVATARS.forEach(a=>{ const b=document.createElement('button'); b.type='button'; b.className='avatar'+(a===state.avatar?' sel':''); b.textContent=a; b.addEventListener('click',()=>{ unlockAudio(); state.avatar=a; save(); av.querySelectorAll('.avatar').forEach(x=>x.classList.toggle('sel',x===b)); say('Die is leuk!'); }); av.appendChild(b); });
$('#gearbtn').addEventListener('click',()=>{ $('#settings').hidden=!$('#settings').hidden; });
$('#soundopt').checked=state.sound; $('#hulpopt').checked=state.hulp; $('#autoopt').checked=state.auto;
$('#soundopt').addEventListener('change',e=>{ state.sound=e.target.checked; save(); $('#soundbtn').textContent=state.sound?'🔊':'🔇'; });
$('#hulpopt').addEventListener('change',e=>{ state.hulp=e.target.checked; save(); });
$('#autoopt').addEventListener('change',e=>{ state.auto=e.target.checked; save(); });
$('#resetbtn').addEventListener('click',()=>{ if(confirm('Alle sterren, stickers en pennen wissen?')){ state.stars={}; state.total=0; state.stickers=[]; state.pen='oranje'; save(); updateStart(); } });
$('#soundbtn').addEventListener('click',()=>{ state.sound=!state.sound; save(); $('#soundbtn').textContent=state.sound?'🔊':'🔇'; $('#soundopt').checked=state.sound; if(!state.sound&&canSpeak()) speechSynthesis.cancel(); });
$('#homebtn').addEventListener('click',()=>{ clearTimeout(state.autoT); if(canSpeak()) speechSynthesis.cancel(); state.strokes=[]; show('start'); });
$('#kaartterug').addEventListener('click',()=>show('start'));
$('#replay').addEventListener('click',()=>{ speakLetter(); if(state.hulp) state.demo=performance.now(); });
$('#voordoen').addEventListener('click',()=>{ if(state.busy) return; state.demo=performance.now(); say('Kijk, zo doe je het.'); });
$('#opnieuw').addEventListener('click',()=>{ if(state.busy) return; loadLetter(state.letter); });
$('#again').addEventListener('click',()=>{ if(fw) fw.stop(); const set=state.set; if(set==='naam') startSession('naam',nameLetters(state.naam)); else if(set==='kaart') startSession('kaart',state.list.slice()); else startSession(set,pickList(SETS[set],8)); });
$('#tostart').addEventListener('click',()=>{ if(fw) fw.stop(); show('start'); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&canSpeak()) speechSynthesis.cancel(); });
updateStart();
</script>
</body>
